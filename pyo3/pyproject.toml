[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "osf-native"
description = "PyO3 native-accelerated OSF bindings (byte-identical to planet-osf; shared osf-core Rust crate)."
requires-python = ">=3.9"
license = { text = "PolyForm-Noncommercial-1.0.0" }
classifiers = ["Programming Language :: Rust", "Topic :: Security :: Cryptography"]

[tool.maturin]
bindings = "pyo3"
module-name = "osf_native"
