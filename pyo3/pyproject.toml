[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "osf-native"
description = "PyO3 native-accelerated OSF bindings (byte-identical to planet-osf; shared osf-core Rust crate)."
requires-python = ">=3.9"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "LEE JUNGHOON (이정훈)", email = "jason@winnerbrothers.org" }]
classifiers = [
  "Programming Language :: Rust",
  "Topic :: Security :: Cryptography",
  "License :: Other/Proprietary License",
]

# Copyright (c) 2026 Winner Brothers Group. Patent: PCT WO 2025/127469 A1.
# Commercial or production use requires a separate license (LICENSE-COMMERCIAL.md).

[project.urls]
Homepage = "https://planet.winnerbrothers.org"
Source = "https://github.com/winnerbrothers/osf"

[tool.maturin]
bindings = "pyo3"
module-name = "osf_native"
