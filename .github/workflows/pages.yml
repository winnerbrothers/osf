name: pages

# Deploys the static public forgery challenge (challenge/) to GitHub Pages.
# No server, no secret at runtime — the page verifies submissions client-side.

on:
  push:
    branches: [main]
    paths:
      - "challenge/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: configure Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: upload challenge/ as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: challenge
      - id: deployment
        uses: actions/deploy-pages@v4
