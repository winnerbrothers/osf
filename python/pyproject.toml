[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planet-osf"
version = "0.3.0"
description = "OSF — a one-line time-synchronized mutual authentication protocol built on SHA-256/HMAC-SHA-256, for login, messaging, transactions and on-device command auth."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "LEE JUNGHOON (이정훈)", email = "jason@winnerbrothers.org" }]
keywords = ["osf", "authentication", "cryptography", "quaternion", "post-quantum", "defense", "zero-trust"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "License :: Other/Proprietary License",
]
# Core / login / coin / defense need NO third-party deps (stdlib only).
dependencies = []

[project.optional-dependencies]
# Forward-secret sealed messaging (ECDH P-256 + AES-256-GCM).
messaging = ["cryptography>=41"]
dev = ["pytest>=7", "cryptography>=41"]

[project.urls]
Homepage = "https://planet.winnerbrothers.org"
Source = "https://github.com/winnerbrothers/osf"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osf = ["py.typed"]
